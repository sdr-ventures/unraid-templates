name: ci

on:
  pull_request:
  push:
    branches: [main]
    # THE RELEASE PATH. This repo publishes nothing — Unraid reads the templates straight off
    # `main` over raw.githubusercontent.com, so merging IS the release. Tags are included so a
    # tag cut at any commit is scanned too: a tag can point at a commit that never went through
    # a PR, which is exactly the history no other trigger here would look at.
    tags: ["v*"]

permissions:
  contents: read

# ⛔⛔ THE THREE REQUIRED STATUS-CHECK CONTEXTS ON `main` (`enforce_admins` on) are, exactly:
#     "leak-guard / No internal info (leak guard)"
#     "Templates are well-formed XML"
#     "Leak-guard tests"
# Renaming any of them does not fail the check — the required context simply never reports, and
# every PR sits `mergeable: true` / `mergeStateStatus: BLOCKED`. To rename one, change the
# branch-protection required context FIRST (a repo-settings change, not a code one), then the job.
jobs:
  # The pinned kw-common guard. The job id must stay `leak-guard`: with the reusable workflow's own
  # job name it forms the required context above. Bump the tag in BOTH places in one PR.
  leak-guard:
    uses: sdr-ventures/kw-common/.github/workflows/leak-guard.yml@v1.7.0
    with:
      version: v1.7.0

  # The repo's regression suite. It began as the leak guard's alone and now also covers
  # sync-templates.py, which earns it the same way: a leak guard that quietly stops guarding,
  # and a sync script that quietly stops syncing, both look exactly like ones that work.
  #
  # ⚠️ DO NOT RENAME THIS JOB. `name:` is the status-check CONTEXT, and `main`'s branch
  # protection lists "Leak-guard tests" as a required check. Renaming it does not fail the
  # check — the required context simply never reports, and every PR sits BLOCKED with three
  # green jobs and no explanation. (Learned the hard way: this job was briefly renamed to
  # describe its widened scope, and the PR doing it could not be merged.) The scope now
  # exceeds the name; that is a cosmetic cost and this is not, so the name stays until the
  # protection rule is changed to match, which is a repo-settings change and not a code one.
  guard-tests:
    name: Leak-guard tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "pytest==8.3.5" "pytest-timeout==2.4.0"
      # --timeout is not optional: one test builds real git repositories, and a hung test that
      # emits nothing is indistinguishable from a slow one until the runner's 6-hour limit.
      - run: python -u -m pytest tests -q --timeout=300

  # Lint the whole repo. The ruff version is pinned to kw-common's: an unpinned install takes
  # whatever release is newest, and a new rule can fail a tree that did not change.
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.1"
      - run: ruff check .

  # ⛔ REQUIRED STATUS CHECK — do not rename. See the note above `jobs:`.
  templates:
    name: Templates are well-formed XML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # A malformed template does not fail loudly — Unraid just silently doesn't offer it
      # under Add Container, which reads as "the repo sync is broken" and costs an hour.
      - name: Parse every template
        run: |
          python - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          bad = []
          files = sorted(glob.glob("templates/*.xml"))
          for f in files:
              try:
                  ET.parse(f)
              except ET.ParseError as e:
                  bad.append(f"{f}: {e}")
          for b in bad:
              print(b)
          print(f"{len(files) - len(bad)}/{len(files)} templates parse")
          sys.exit(1 if bad or not files else 0)
          PY
