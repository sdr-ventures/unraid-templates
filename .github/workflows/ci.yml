name: ci

on:
  pull_request:
  push:
    branches: [main]
    # THE RELEASE PATH. This repo publishes nothing — Unraid reads the templates straight off
    # `main` over raw.githubusercontent.com, so merging IS the release. Tags are included so a
    # tag cut at any commit is scanned too: a tag can point at a commit that never went through
    # a PR, which is exactly the history no other trigger here would look at.
    tags: ["v*"]

permissions:
  contents: read

# ⛔⛔ ALL THREE `name:` STRINGS BELOW ARE REQUIRED STATUS-CHECK CONTEXTS ON `main`, and the
# protection has `enforce_admins` on. The required contexts are, exactly:
#     "No internal info (public-repo guard)"
#     "Templates are well-formed XML"
#     "Leak-guard tests"
# Renaming any of them does not fail the check — the required context simply never reports, and
# every PR sits `mergeable: true` / `mergeStateStatus: BLOCKED`: three green jobs, nothing
# failing, permanently unmergeable. The names are invisible from the repo, which is why they are
# written down here. To rename one, change the branch-protection required context FIRST (a
# repo-settings change, not a code one), then the job.
# Verified 2026-08-25: `gh api repos/sdr-ventures/unraid-templates/branches/main/protection`.
jobs:
  # ⛔ REQUIRED STATUS CHECK — do not rename. See the note above `jobs:`.
  # This repo is PUBLIC by necessity — Unraid fetches the icons and templates anonymously
  # over raw.githubusercontent.com. That makes it the likeliest place for a concrete host,
  # IP or appdata path to leak, because templates are where operator-specific values live.
  # Every such default must be a visible placeholder the operator replaces at creation.
  no-internal-info:
    name: No internal info (public-repo guard)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The COMMIT-RANGE scan below needs real history; the default shallow checkout has
          # none, and `git rev-list base..head` on it fails rather than silently scanning zero
          # commits (the script turns that failure into exit 1 on purpose).
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Self-test the patterns, then scan the working tree
        run: |
          python scripts/check_no_internal_info.py --selftest
          python scripts/check_no_internal_info.py
      # TWO DIFFERENT QUESTIONS, so two scans. The tree scan above answers "is the leak here
      # NOW", and it reads `git ls-files` — TRACKED files only. It is blind to a brand-new file
      # that was never staged, which is how a synthetic internal hostname reached a public
      # remote: the guard was run before `git add`, found nothing, and the next commit published
      # it. It is equally blind to a value committed and then deleted, which stays permanently
      # readable at the commit that added it.
      #
      # The range scan reads what each COMMIT added, so it sees both. Catching either before the
      # merge is the difference between an amend and a history rewrite across every clone.
      - name: Scan the commits being published
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -eu
          z40=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # A tag can point at ANY commit, including one that never went through a PR or
            # `main`. `github.event.before` is the null sha on a tag push, so there is no
            # "what this push added" to lean on; the meaningful question is what the tag
            # carries that `main` has not already had reviewed. Fetch the base explicitly
            # rather than assuming checkout left a remote-tracking ref behind.
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            # ⭐ `$GITHUB_REF` (refs/tags/<name>), NOT `$PUSH_HEAD`. The commits covered are the
            # same either way, but the REF is what NAMES the tag object — and its name, its
            # tagger and its message are published by this push. The guard scans a tag only when
            # the range names it, so with the bare commit sha a tag cut at an already-merged
            # commit resolved to zero commits and the whole tag object went unread.
            range="origin/main..$GITHUB_REF"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$z40" ]; then
            # The branch was created by this push, so there is no previous tip. Scan the commit
            # itself rather than reporting clean — "I could not work out a range" must never be
            # a pass, which is the one failure mode a leak guard cannot have.
            if git rev-parse --verify -q "${PUSH_HEAD}^" >/dev/null; then
              range="${PUSH_HEAD}^..${PUSH_HEAD}"
            else
              range="$PUSH_HEAD"   # root commit: scan all of it
            fi
          else
            range="$PUSH_BEFORE..$PUSH_HEAD"
          fi
          echo "range: $range"
          python scripts/check_no_internal_info.py --range "$range"

  # The repo's regression suite. It began as the leak guard's alone and now also covers
  # sync-templates.py, which earns it the same way: a leak guard that quietly stops guarding,
  # and a sync script that quietly stops syncing, both look exactly like ones that work.
  #
  # ⚠️ DO NOT RENAME THIS JOB. `name:` is the status-check CONTEXT, and `main`'s branch
  # protection lists "Leak-guard tests" as a required check. Renaming it does not fail the
  # check — the required context simply never reports, and every PR sits BLOCKED with three
  # green jobs and no explanation. (Learned the hard way: this job was briefly renamed to
  # describe its widened scope, and the PR doing it could not be merged.) The scope now
  # exceeds the name; that is a cosmetic cost and this is not, so the name stays until the
  # protection rule is changed to match, which is a repo-settings change and not a code one.
  guard-tests:
    name: Leak-guard tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "pytest==8.3.5" "pytest-timeout==2.4.0"
      # --timeout is not optional: one test builds real git repositories, and a hung test that
      # emits nothing is indistinguishable from a slow one until the runner's 6-hour limit.
      - run: python -u -m pytest tests -q --timeout=300

  # ⛔ REQUIRED STATUS CHECK — do not rename. See the note above `jobs:`.
  templates:
    name: Templates are well-formed XML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # A malformed template does not fail loudly — Unraid just silently doesn't offer it
      # under Add Container, which reads as "the repo sync is broken" and costs an hour.
      - name: Parse every template
        run: |
          python - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          bad = []
          files = sorted(glob.glob("templates/*.xml"))
          for f in files:
              try:
                  ET.parse(f)
              except ET.ParseError as e:
                  bad.append(f"{f}: {e}")
          for b in bad:
              print(b)
          print(f"{len(files) - len(bad)}/{len(files)} templates parse")
          sys.exit(1 if bad or not files else 0)
          PY
